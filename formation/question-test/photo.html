<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Photo de l’événement</title>

  <link rel="stylesheet" href="../../styles/style.css" />
</head>

<body>
  <main class="card">
    <div class="logo">
      DIVERTY <span>EVENTS</span>
    </div>

    <h1>Merci pour votre participation !</h1>

    <div class="underline"></div>

    <div class="intro">
      Votre équipe a relevé la mission. Voici la photo souvenir de votre expérience.
    </div>

    <img
      class="event-photo"
      src="../../photo-test.jpg"
      alt="Photo de l’événement"
    />

    <div class="info">
      <strong>Bravo à toute l’équipe.</strong>
      <br />
      Merci d’avoir participé à cette expérience DIVERTY.
    </div>
  </main>
</body>
</html>
